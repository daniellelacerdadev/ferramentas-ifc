<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pareceres</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" 
    integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" 
    crossorigin="anonymous">
     <!-- Estilo customizado -->
    <link rel="stylesheet" type="text/css" href="/css/geral.css">
    <link rel="stylesheet" type="text/css" href="/css/calcula-quinq.css">

     

     <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/1e631c2bc0.js" crossorigin="anonymous"></script>
</head>
<body>
   <body>
     <header class="cabecalho">

            <div class="logo">
                <img src="/assets/logo_gov.png" width="400"  alt="Logo do governo e dados do órgão de emissão">
             </div>

           <nav>

                <a
                 href="/index.html"
                    class="btn btn-outline-rosa">

                  Voltar ao Menu Principal

                </a>

           </nav>
        </header>

        <section>
            <div class="quinquenio-box">
              <h3>Calculadora de Quinquênio</h3>

                <label for="dataIngresso">
                  Data de ingresso no serviço público federal:
                </label>

                  <input type="date" id="dataIngresso">

                    <button onclick="calcularQuinquenio()">
                       Calcular
                    </button>

                      <div id="resultado"></div>
                      </div>
        </section>
      

        <footer class="rodape">

          <img src="/assets/logo_ifc.png" class="logoifc"  alt="Logo IFC">

          <div class="endereco">  

           <img src="/assets/end_rodape.png"  alt="Endereço da Reitoria IFC">

       </footer>

      </div>



    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js" integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js" integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
    <script src="/js/calcula-quinquenio.js" defer></script>
</body>
</html>
